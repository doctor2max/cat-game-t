<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <!-- Fur & Eye Gradients -->
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f2963f"/>
      <stop offset="65%" stop-color="#e47e28"/>
      <stop offset="100%" stop-color="#c96519"/>
    </linearGradient>
    <radialGradient id="headGrad" cx="46%" cy="44%" r="54%">
      <stop offset="0%" stop-color="#f6a24b"/>
      <stop offset="70%" stop-color="#e5812b"/>
      <stop offset="100%" stop-color="#c96418"/>
    </radialGradient>
    <radialGradient id="irisGrad" cx="50%" cy="68%" r="55%">
      <stop offset="0%" stop-color="#f2c464"/>
      <stop offset="48%" stop-color="#a45c1b"/>
      <stop offset="100%" stop-color="#482107"/>
    </radialGradient>
    <linearGradient id="earPink" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f099a6"/>
      <stop offset="100%" stop-color="#d67181"/>
    </linearGradient>
    <radialGradient id="bellGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fff4a3"/>
      <stop offset="55%" stop-color="#f2bd34"/>
      <stop offset="100%" stop-color="#a86a10"/>
    </radialGradient>
    <clipPath id="leftEyeClip">
      <path d="M 135,193 C 134,174 156,170 165,187 C 171,200 163,215 148,214 C 137,213 135,203 135,193 Z"/>
    </clipPath>
    <clipPath id="rightEyeClip">
      <path d="M 190,192 C 193,167 224,163 233,182 C 240,197 226,214 206,214 C 193,214 188,204 190,192 Z"/>
    </clipPath>
  </defs>

  <!-- 1. GRACEFUL UPRIGHT TAIL -->
  <g stroke-linejoin="round" stroke-linecap="round">
    <path d="M 326,274 C 362,262 385,222 372,175 C 366,154 365,146 372,175" fill="none" stroke="#5c280c" stroke-width="30"/>
    <path d="M 326,274 C 362,262 385,222 372,175" fill="none" stroke="url(#bodyGrad)" stroke-width="24"/>
    <!-- Tail Tabby Stripes -->
    <path d="M 345,264 C 352,256 360,258 364,264" fill="none" stroke="#be5316" stroke-width="8"/>
    <path d="M 362,240 C 370,234 378,236 382,242" fill="none" stroke="#be5316" stroke-width="9"/>
    <path d="M 367,212 C 375,207 383,209 386,215" fill="none" stroke="#be5316" stroke-width="9"/>
    <path d="M 364,187 C 373,182 381,184 384,189" fill="none" stroke="#be5316" stroke-width="8"/>
    <!-- Fluffy White Tail Tip -->
    <path d="M 357,183 C 344,165 347,145 358,140 C 370,135 384,152 386,178 L 379,173 L 374,181 L 367,174 L 362,183 Z" fill="#fff8ee" stroke="#5c280c" stroke-width="3.2"/>
  </g>

  <!-- 2. FAR HIND LEG & FAR FORELEG (Behind body) -->
  <g stroke-linejoin="round" stroke-linecap="round">
    <!-- Far Hind Leg (middle-right) -->
    <path d="M 262,315 C 272,336 286,348 278,376 L 296,378 C 304,352 300,334 292,310 Z" fill="#c66018" stroke="#5c280c" stroke-width="3.2"/>
    <path d="M 271,334 L 294,330 M 276,348 L 296,345" stroke="#a3430e" stroke-width="5"/>
    <!-- White Sock & Paw -->
    <path d="M 277,364 L 283,368 L 289,363 L 296,367 L 294,386 L 272,386 Z" fill="#eadbcf"/>
    <path d="M 269,386 C 260,386 259,398 269,399 L 290,399 C 296,399 297,392 294,385" fill="#eadbcf" stroke="#5c280c" stroke-width="3.2"/>
    <path d="M 270,387 C 267,392 268,397 271,399 M 279,388 C 276,393 277,397 280,399" fill="none" stroke="#5c280c" stroke-width="2.6"/>

    <!-- Far Foreleg (front-left) -->
    <path d="M 192,296 L 204,376 L 226,376 L 228,302 Z" fill="#d46d1f" stroke="#5c280c" stroke-width="3.2"/>
    <path d="M 198,325 L 222,323 M 201,343 L 223,341" stroke="#b34b12" stroke-width="5"/>
    <!-- White Sock & Paw -->
    <path d="M 203,358 L 210,362 L 217,357 L 226,361 L 226,386 L 202,386 Z" fill="#f7efe4"/>
    <path d="M 198,384 C 188,384 188,399 199,399 L 221,399 C 226,399 227,392 225,384" fill="#f7efe4" stroke="#5c280c" stroke-width="3.2"/>
    <path d="M 199,385 C 196,391 197,397 200,399 M 208,386 C 205,392 206,397 209,399" fill="none" stroke="#5c280c" stroke-width="2.6"/>
  </g>

  <!-- 3. SLEEK TORSO & BACK TABBY STRIPES -->
  <g stroke-linejoin="round" stroke-linecap="round">
    <path d="M 195,254 C 235,248 288,255 322,265 C 342,273 344,306 334,322 C 302,326 265,325 225,318 C 195,312 186,282 195,254 Z" fill="url(#bodyGrad)" stroke="#5c280c" stroke-width="3.4"/>
    <!-- Cream Underbelly Patch -->
    <path d="M 262,315 C 278,313 292,314 302,317 C 292,326 274,326 262,315 Z" fill="#f5e6d6" stroke="#5c280c" stroke-width="2.4"/>
    <!-- Back Tapered Tiger Stripes -->
    <path d="M 258,253 L 271,254 L 265,282 Z" fill="#be5316"/>
    <path d="M 281,256 L 296,258 L 289,291 Z" fill="#be5316"/>
    <path d="M 307,260 L 320,264 L 311,288 Z" fill="#be5316"/>
  </g>

  <!-- 4. NEAR HIND LEG & NEAR FORELEG -->
  <g stroke-linejoin="round" stroke-linecap="round">
    <!-- Near Hind Leg (back-right) -->
    <path d="M 296,304 C 300,334 316,352 325,376 L 344,376 C 348,350 338,325 336,296" fill="url(#bodyGrad)" stroke="#5c280c" stroke-width="3.2"/>
    <path d="M 302,324 L 326,320 M 309,340 L 334,335" stroke="#be5316" stroke-width="5.5"/>
    <!-- White Sock & Paw -->
    <path d="M 323,363 L 330,367 L 337,362 L 344,366 L 343,386 L 321,386 Z" fill="#fff8ee"/>
    <path d="M 321,384 C 312,384 312,399 323,399 L 342,399 C 347,399 348,391 344,384" fill="#fff8ee" stroke="#5c280c" stroke-width="3.2"/>
    <path d="M 323,385 C 320,391 321,397 324,399 M 332,386 C 329,392 330,397 333,399" fill="none" stroke="#5c280c" stroke-width="2.6"/>

    <!-- Fluffy White Chest Ruff / Bib -->
    <path d="M 192,254 C 182,265 182,276 188,283 L 182,288 C 185,296 190,301 196,304 L 192,310 C 204,321 218,328 236,330 C 238,308 232,276 222,256 Z" fill="#fff8ee" stroke="#5c280c" stroke-width="3.2"/>
    <!-- Soft Cel-Shadow on lower chest ruff -->
    <path d="M 196,303 C 208,312 222,316 235,317 L 236,330 C 218,328 204,321 192,310 Z" fill="#eadbcf"/>

    <!-- Near Foreleg (front-center) -->
    <path d="M 232,296 C 238,326 240,352 232,376 L 256,376 C 266,352 272,328 268,302" fill="url(#bodyGrad)" stroke="#5c280c" stroke-width="3.2"/>
    <path d="M 244,316 L 266,317 M 242,334 L 264,336" stroke="#be5316" stroke-width="5.5"/>
    <!-- White Sock & Paw -->
    <path d="M 233,356 L 241,361 L 248,355 L 258,360 L 255,386 L 228,386 Z" fill="#fff8ee"/>
    <path d="M 228,383 C 218,383 218,399 230,399 L 252,399 C 258,399 259,391 255,383" fill="#fff8ee" stroke="#5c280c" stroke-width="3.2"/>
    <path d="M 230,384 C 227,390 228,397 231,399 M 240,385 C 237,391 238,397 241,399" fill="none" stroke="#5c280c" stroke-width="2.6"/>
  </g>

  <!-- 5. RED COLLAR & GOLDEN BELL -->
  <g stroke-linejoin="round" stroke-linecap="round">
    <path d="M 185,250 C 204,260 228,252 243,237 L 246,246 C 230,263 204,271 187,261 Z" fill="#c82323" stroke="#5c280c" stroke-width="3.2"/>
    <!-- Gold Bell Loop & Sphere -->
    <rect x="197" y="258" width="5" height="7" rx="2" fill="#f2bd34" stroke="#5c280c" stroke-width="2.2"/>
    <circle cx="199" cy="272" r="9.5" fill="url(#bellGrad)" stroke="#5c280c" stroke-width="3"/>
    <circle cx="196" cy="274" r="2.3" fill="#3d1705"/>
    <path d="M 196,274 L 205,277" stroke="#3d1705" stroke-width="2.2"/>
  </g>

  <!-- 6. SWEET DISNEY/PIXAR-STYLE HEAD (Exact Match!) -->
  <g stroke-linejoin="round" stroke-linecap="round">
    <!-- Far Ear (Left) -->
    <path d="M 136,178 C 130,152 135,126 142,110 C 156,120 168,134 176,146 Z" fill="url(#headGrad)" stroke="#5c280c" stroke-width="3.4"/>
    <path d="M 139,172 C 135,152 139,130 144,117 C 154,126 163,138 168,148 Z" fill="url(#earPink)"/>
    <!-- Far Ear Base Fur Tuft -->
    <path d="M 138,170 L 146,160 L 148,166 L 155,159 L 158,166 Z" fill="#e5812b" stroke="#5c280c" stroke-width="2.2"/>

    <!-- Near Ear (Right) -->
    <path d="M 212,142 C 224,122 237,108 248,98 C 262,122 268,156 262,186 Z" fill="url(#headGrad)" stroke="#5c280c" stroke-width="3.4"/>
    <path d="M 222,146 C 231,130 240,118 247,110 C 257,130 261,156 256,178 Z" fill="url(#earPink)"/>
    <!-- Near Ear Inner Fur Notch -->
    <path d="M 222,146 L 238,135 L 234,144 L 245,140 L 238,150 L 245,151 L 236,158 Z" fill="#e5812b" stroke="#5c280c" stroke-width="2.4"/>

    <!-- Main Head Contour with Cheek Ruffs & Crown Hair Tuft -->
    <path d="M 136,175
             C 138,156 158,144 182,141
             L 178,125 C 184,125 189,130 192,135
             L 191,129 C 196,130 200,135 202,140
             C 228,142 252,158 262,184
             L 276,197 L 266,205 L 272,212
             C 258,236 226,252 186,251
             C 154,250 132,235 123,215
             L 130,212 L 126,206 L 135,202
             C 134,192 134,183 136,175 Z"
          fill="url(#headGrad)" stroke="#5c280c" stroke-width="3.4"/>

    <!-- Forehead & Cheek Tabby Stripes -->
    <path d="M 164,148 L 178,145 L 174,166 Z" fill="#be5316"/>
    <path d="M 192,144 L 205,146 L 196,167 Z" fill="#be5316"/>
    <!-- Right Cheek Stripes -->
    <path d="M 244,200 C 254,196 262,196 270,198" fill="none" stroke="#be5316" stroke-width="5"/>
    <path d="M 238,214 C 248,212 256,212 264,214" fill="none" stroke="#be5316" stroke-width="5"/>
    <!-- Left Cheek Stripes -->
    <path d="M 129,205 L 138,207 M 126,214 L 136,216" fill="none" stroke="#be5316" stroke-width="4"/>

    <!-- Expressive Arched Eyebrows -->
    <path d="M 142,167 C 148,161 156,161 162,166" fill="none" stroke="#7d3209" stroke-width="4.2"/>
    <path d="M 194,158 C 204,154 214,156 221,162" fill="none" stroke="#7d3209" stroke-width="4.5"/>

    <!-- LEFT EYE (Far Eye) -->
    <g>
      <path d="M 135,193 C 134,174 156,170 165,187 C 171,200 163,215 148,214 C 137,213 135,203 135,193 Z" fill="#fcf4df"/>
      <g clip-path="url(#leftEyeClip)">
        <ellipse cx="149" cy="195" rx="13.5" ry="16" fill="url(#irisGrad)"/>
        <ellipse cx="149" cy="195" rx="8.5" ry="11" fill="#1b0b04"/>
        <!-- Sparkle Catchlights -->
        <circle cx="144" cy="188" r="4.6" fill="#ffffff"/>
        <circle cx="153" cy="201" r="2.0" fill="#ffffff"/>
      </g>
      <path d="M 135,193 C 134,174 156,170 165,187 C 171,200 163,215 148,214 C 137,213 135,203 135,193 Z" fill="none" stroke="#2c1205" stroke-width="3"/>
      <!-- Upper Eyelash & Wing -->
      <path d="M 131,188 C 135,172 156,169 166,186" fill="none" stroke="#1c0a02" stroke-width="5.5"/>
    </g>

    <!-- RIGHT EYE (Near Eye) -->
    <g>
      <path d="M 190,192 C 193,167 224,163 233,182 C 240,197 226,214 206,214 C 193,214 188,204 190,192 Z" fill="#fcf4df"/>
      <g clip-path="url(#rightEyeClip)">
        <ellipse cx="206" cy="192" rx="16.5" ry="18.5" fill="url(#irisGrad)"/>
        <ellipse cx="206" cy="192" rx="10.5" ry="12.8" fill="#1b0b04"/>
        <!-- Sparkle Catchlights -->
        <circle cx="200" cy="184" r="5.5" fill="#ffffff"/>
        <circle cx="211" cy="199" r="2.2" fill="#ffffff"/>
      </g>
      <path d="M 190,192 C 193,167 224,163 233,182 C 240,197 226,214 206,214 C 193,214 188,204 190,192 Z" fill="none" stroke="#2c1205" stroke-width="3.2"/>
      <!-- Upper Eyelash & Winged Flick -->
      <path d="M 190,188 C 195,165 224,163 234,182 L 240,178" fill="none" stroke="#1c0a02" stroke-width="6"/>
    </g>

    <!-- PLUMP CREAM-WHITE MUZZLE PUFF & CHIN -->
    <path d="M 171,206
             C 161,206 156,214 159,223
             C 161,232 169,238 179,238
             C 191,238 199,231 199,221
             C 199,212 191,206 181,206 Z"
          fill="#fff8ee"/>
    <!-- Soft lower chin crease -->
    <path d="M 164,232 C 172,239 186,239 194,231" fill="none" stroke="#b57a50" stroke-width="2.2"/>

    <!-- SWEET PINK TRIANGULAR NOSE & ':3' SMILE -->
    <path d="M 165,213 C 169,210 175,210 179,213 L 172,221 Z" fill="#ea7b91" stroke="#5c280c" stroke-width="2.6"/>
    <ellipse cx="171" cy="213.5" rx="3" ry="1.2" fill="#ffffff" opacity="0.65"/>
    <path d="M 172,221 L 172,225 C 168,229 162,228 160,224 M 172,225 C 177,230 186,229 190,222" fill="none" stroke="#5c280c" stroke-width="2.8"/>

    <!-- DELICATE WHITE WHISKERS (Cheeks + Brow Feelers) -->
    <g fill="none" stroke="#ffffff" stroke-width="1.8" opacity="0.92">
      <!-- Right Whiskers -->
      <path d="M 196,216 C 218,214 238,216 256,221"/>
      <path d="M 196,221 C 218,222 238,227 254,235"/>
      <path d="M 193,226 C 212,231 228,238 242,247"/>
      <!-- Left Whiskers -->
      <path d="M 160,216 C 140,214 120,216 104,221"/>
      <path d="M 160,221 C 140,222 120,227 106,236"/>
      <path d="M 162,226 C 144,231 128,239 114,249"/>
      <!-- Long Eyebrow Feelers -->
      <path d="M 150,162 C 142,146 134,132 126,120"/>
      <path d="M 156,161 C 151,144 146,130 142,118"/>
      <path d="M 199,155 C 200,136 202,120 205,106"/>
      <path d="M 206,156 C 210,138 215,122 221,108"/>
    </g>
  </g>
</svg>
